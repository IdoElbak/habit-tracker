name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK bits this project pins
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      # One keystore, for ever. Android refuses an update signed by a different key, so losing
      # this secret means every install has to be uninstalled and reinstalled by hand.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tracker.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/tracker.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk tracker.apk

      # The README's permanent link points at releases/latest/download/tracker.apk, so the
      # asset name must stay exactly this.
      - uses: softprops/action-gh-release@v2
        with:
          files: tracker.apk
          generate_release_notes: true
