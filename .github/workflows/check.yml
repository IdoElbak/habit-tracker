name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk is 37.1, and platforms are minor-versioned now: `platforms;android-37`
      # does not exist. Both parts are required or the build cannot resolve the platform.
      - name: Install the SDK bits this project pins
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
