org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP's Gradle plugin still registers its generated sources through the Kotlin source-set DSL,
# which AGP 9's built-in Kotlin rejects by default. This is Google's documented escape hatch.
# See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
